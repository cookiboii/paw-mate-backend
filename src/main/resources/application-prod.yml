spring:
  config:
    activate:
      on-profile: prod

  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false

  datasource:
    url: ${DB_URL:jdbc:mysql://${DB_HOST:svc.sel3.cloudtype.app}:${DB_PORT:31603}/${DB_NAME:adoptpet_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&connectTimeout=30000&socketTimeout=60000&maxAllowedPacket=134217728}
    username: ${DB_USERNAME:adoptmate}
    password: ${DB_PASSWORD:adoptmate}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 10000
      validation-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: SELECT 1
      keepalive-time: 300000
      maximum-pool-size: 30
      minimum-idle: 30

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
        show_sql: false
        default_batch_fetch_size: 100
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST:resolved-drake-197654.upstash.io}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:default}
      password: ${REDIS_PASSWORD:gQAAAAAAAwQWAAIgcDFkNmIwZGNmYmQ1NjA0MmUyYjE5ZWExNjkxOWMxOWFkZA}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:true}

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID:kakao-client-id}
            client-secret: ${KAKAO_CLIENT_SECRET:kakao-client-secret}
            redirect-uri: ${KAKAO_REDIRECT_URI:https://port-0-paw-mate-backend-msiq1pqe2aa00cb9.sel3.cloudtype.app/adoptmate/kakao}

logging:
  level:
    root: INFO
    com.kindtail: INFO
    org.hibernate.SQL: WARN